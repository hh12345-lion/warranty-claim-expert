[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# /api/submit-lead → Next.js route (webhook primary + soft-fail Sheets, one tab + Form Type)

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"

# AHREFS_WWW_APEX_REDIRECT — flatten https://www → apex (reduces Ahrefs redirect-chain)
[[redirects]]
  from = "/*"
  to = "https://warrantyclaimexpert.com/:splat"
  status = 301
  force = true
  conditions = {Host = ["www.warrantyclaimexpert.com"]}
